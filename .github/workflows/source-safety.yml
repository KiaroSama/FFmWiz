name: Source safety verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Record tested source identity
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/tested-sha.txt"
          git archive --format=zip -o "$RUNNER_TEMP/tested-source.zip" HEAD
      - name: Retain reproducible source
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: source-safety-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tested-source.zip
            ${{ runner.temp }}/tested-sha.txt
          retention-days: 3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify transitive resources and source aliases
        # The existing Windows matrix remains the full-suite gate. This leg
        # adds POSIX grammar and filesystem coverage without pretending to run Qt.
        run: |
          python tests/run_suite.py -j 2 --require ffmpeg --json "$RUNNER_TEMP/source-safety.json" -k command_io_transitive -k command_io_lavfi -k command_read_write_manifest -k source_alias -k track_manager_source_safety
      - name: Retain result
        id: result-upload
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: source-safety-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-safety.json
            ${{ runner.temp }}/tested-sha.txt
          retention-days: 7
      - name: Record quota-independent summary
        if: always()
        run: python tools/ci_result_summary.py "$RUNNER_TEMP/source-safety.json" "source safety / Linux" "${{ steps.result-upload.outcome }}"
