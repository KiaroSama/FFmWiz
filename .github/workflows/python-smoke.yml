name: CI

# Push is limited to main: a branch push with an open PR otherwise starts every
# job twice on 2x-billed Windows minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job reads `vars.CI_RUNNER` and falls back to `windows-latest`, so the
# default behaviour is unchanged and hosted runners stay the norm. Setting the
# repository variable to `self-hosted` moves the whole matrix onto a registered
# runner; UNSETTING it moves everything straight back, with no edit to this
# file. That escape hatch exists because GitHub-hosted minutes can stop being
# available for reasons that have nothing to do with the code -- a billing or
# spending-limit block starts every job and ends it in about two seconds with
# no steps at all, which reads as a red X and is not one.
#
# Jobs must therefore not assume a disposable machine. Nothing here installs
# software system-wide, every job builds its OWN virtual environment, and every
# ffmpeg download unpacks into a fresh per-version directory. On a persistent
# runner the alternative is silent contamination: a package another job left
# behind turns the "no PySide6" leg into a lie, and a reused extraction
# directory can serve a build nobody pinned.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installs nothing: py_compile, the template check and the import smoke check
  # all run on the standard library alone.
  compile:
    runs-on: ${{ vars.CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of requires-python = ">=3.10".
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create a job-scoped virtual environment
        # A persistent runner keeps whatever the last job installed. This leg
        # exists to prove the CLI imports with NO third-party package present,
        # so it must not inherit one. `--without-pip` because it installs
        # nothing at all, by design.
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/venv-compile"
          echo "$RUNNER_TEMP/venv-compile/Scripts" >> "$GITHUB_PATH"

      - name: Show the interpreter this job will use
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: |
          python -c "import sys; print(sys.executable); print(sys.version)"
          python -c "import sys, pathlib; want = pathlib.Path(r'$RUNNER_TEMP/venv-compile').resolve(); got = pathlib.Path(sys.executable).resolve(); sys.exit(0) if want in got.parents else sys.exit(f'not the job venv: {got}')"

      - name: Compile Python files
        run: |
          python -c "import pathlib, sys; missing=[p for p in sys.argv[1:] if not pathlib.Path(p).is_file()]; sys.exit('missing: ' + ', '.join(missing)) if missing else None" FFmWiz.py ffmwiz/gui/classic/ffmwiz_gui.py ffmwiz/gui/modern/ffmwiz_gui_qml.py
          python -m py_compile FFmWiz.py ffmwiz/gui/classic/ffmwiz_gui.py ffmwiz/gui/modern/ffmwiz_gui_qml.py
          python -m compileall -q ffmwiz

      - name: Validate config.env template
        run: python -c "import FFmWiz, pathlib; tpl=pathlib.Path('config.env.example').read_text(encoding='utf-8'); assert FFmWiz.CONFIG_TEMPLATE==tpl, 'template/example drift'; s=FFmWiz.parse_env_config(tpl)['settings']; assert s.get('video_codec') and 'use_gpu' in s and s.get('gui_engine')=='classic'; print('config.env template OK')"

      - name: Import smoke check (CLI must import without PySide6)
        run: python -c "import sys; sys.modules['PySide6'] = None; import FFmWiz; assert hasattr(FFmWiz, 'build_add_files_to_video_command'); assert hasattr(FFmWiz, 'run_media_info_mode'); assert hasattr(FFmWiz, 'run_mux_cleanup_mode'); assert hasattr(FFmWiz, 'run_hardsub_encode_mode'); assert hasattr(FFmWiz, 'build_hardsub_command'); assert hasattr(FFmWiz, 'confirm_numeric_target_not_above_source'); assert hasattr(FFmWiz, 'confirm_resolution_not_above_source'); assert hasattr(FFmWiz, 'analyze_copy_cut_chapter_plan'); assert hasattr(FFmWiz, 'add_files_stream_copy_compatibility_errors'); assert '.webvtt' in FFmWiz.HARDSUB_SUBTITLE_EXTS; assert FFmWiz.display_language('und') == 'unknown'; assert FFmWiz.describe_video_bit_depth({'pix_fmt':'yuv420p10le'}) == '10-bit'; assert FFmWiz.run_mux_cleanup_mode.__module__ == 'ffmwiz.support.ext00b'; assert 'MB' in FFmWiz.media_info_value_with_units('size', '1048576'); assert 'bit/s' in FFmWiz.media_info_value_with_units('bit_rate', '128000'); assert 's)' in FFmWiz.media_info_value_with_units('duration', '12.5'); assert FFmWiz.default_media_reports_dir().name == 'MediaReports'"

      - name: Waveform maths with NO numpy installed
        # numpy is an ACCELERATOR in the waveform model, not a requirement, and
        # the stdlib `array('h')` path is what a user without it actually runs.
        # Every other job installs numpy, so that path was only ever exercised
        # by a test that imports numpy to build its own fixture -- which is not
        # the same interpreter (A01/CI). This leg has nothing installed at all,
        # so the fallback is proved where it is genuinely alone.
        shell: bash --noprofile --norc -eo pipefail "{0}"
        timeout-minutes: 10
        run: |
          python -c "import importlib.util, sys; sys.exit('numpy leaked into the no-dependency leg') if importlib.util.find_spec('numpy') else print('numpy is absent, as this leg requires')"
          python tests/run_suite.py -j 2 -k join_waveform_clock -k qml_waveform -k theme_tokens

      - name: Prove no third-party package reached this leg
        # The check above stubs PySide6 out; this one proves the stub was not
        # papering over a real installation a previous job left on the runner.
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: |
          python -c "import importlib.util, sys; leaked=[m for m in ('PySide6','numpy','setuptools') if importlib.util.find_spec(m)]; sys.exit('third-party packages leaked into the no-dependency leg - ' + ', '.join(leaked)) if leaked else print('clean interpreter')"

  tests:
    runs-on: ${{ vars.CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 25
    # The real-ffmpeg tests print progress lines containing non-ASCII separators;
    # on a cp1252 console that is a UnicodeEncodeError, not a test failure.
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        ffmpeg: ["latest"]
        include:
          # scale/scale_cuda gained reset_sar in the 7.2/8.0 line; 7.1.1 is the
          # last release without it, so it is the only leg that runs the
          # portable square-pixel fallback older users actually get. One extra
          # leg, not a 2x2 cross product: which branch is taken depends on the
          # ffmpeg build, never on the Python version.
          - python-version: "3.13"
            ffmpeg: "7.1.1"
          # The declared FLOOR. Subtitle cue times are the one area that has
          # drifted between builds -- an external audit on 6.1.1 saw extraction
          # rebase cues by the container start time, which the newest build does
          # not do. Only a real 6.1 run proves the fix is version-independent
          # rather than accidentally true on one build.
          - python-version: "3.13"
            ffmpeg: "6.1.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create a job-owned scratch directory
        # EVERY temporary file this job makes must land somewhere this job owns.
        # The previous cleanup swept `$env:TEMP` for `ffmwiz_*` and deleted every
        # match: on a self-hosted runner running as the desktop user that is the
        # SAME %TEMP% the user's own editor sessions and retained manual-command
        # inputs live in, so a prefix match was being treated as proof of
        # ownership. It is not. Pointing TEMP/TMP/TMPDIR at a per-job directory
        # under RUNNER_TEMP makes ownership structural: the sweep can then be a
        # single scoped delete instead of a pattern hunt through shared state.
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "ffmwiz-scratch-$env:GITHUB_RUN_ID-$env:GITHUB_JOB-${{ matrix.python-version }}-${{ matrix.ffmpeg }}"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          "TEMP=$scratch"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMPDIR=$scratch"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFMWIZ_SCRATCH=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "job scratch: $scratch"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Hosted runners are disposable, so the pip cache has to travel with
          # the job. A self-hosted one keeps its own pip cache on disk between
          # runs, which makes the upload pure overhead -- measured at 13m04s of
          # a 15m budget for the PySide6 job, against 4s for the install it was
          # meant to speed up.
          #
          # The first branch must be the TRUTHY one. `X && '' || 'pip'` reads as
          # a ternary and is not one: GitHub's `&&` yields the empty string,
          # which is FALSE, so `||` fell through to 'pip' whether the variable
          # was set or not and the cache was never actually disabled (F11).
          cache: ${{ !vars.CI_RUNNER && 'pip' || '' }}

      - name: Create a job-scoped virtual environment
        # Test dependencies go HERE, never into the runner's own interpreter and
        # never into requirements.txt, which is the runtime manifest.
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: |
          python -m venv "$RUNNER_TEMP/venv-tests"
          echo "$RUNNER_TEMP/venv-tests/Scripts" >> "$GITHUB_PATH"

      - name: Install test dependencies
        # numpy is needed by the waveform tests only. PySide6 is not installed
        # here - the Qt suites belong to the gui-import job.
        #
        # setuptools/wheel are NOT optional: tests/test_packaging.py builds a
        # real wheel to prove the artifact still contains the ffmwiz package,
        # and it self-skips when the build backend is missing. Since Python 3.12
        # `ensurepip` ships neither, so this leg silently skipped the only proof
        # the wheel works at all.
        run: python -m pip install --disable-pip-version-check numpy setuptools wheel

      - name: Install ffmpeg ${{ matrix.ffmpeg }}
        # Without ffmpeg on PATH the real-encode suites self-skip and this job
        # reports OK having never executed a single ffmpeg assertion.
        #
        # Unpacked, not installed. `choco install --allow-downgrade` mutates the
        # MACHINE, which is merely wasteful on a throwaway hosted runner and
        # destructive on a self-hosted one -- it would downgrade the host's own
        # ffmpeg to whatever this leg pins. These are the same gyan.dev builds
        # the chocolatey package embeds, dropped in RUNNER_TEMP and put on PATH
        # for this job only. GITHUB_PATH PREPENDS, so a pinned leg still wins
        # over an ffmpeg the host already has, and the step below proves it did.
        #
        # The extraction directory is REMOVED first. On a persistent runner a
        # reused directory can still hold the previous archive's tree, so the
        # pin would be honoured by the download and quietly ignored on disk.
        #
        # SHA256: pinned in this file for the two fixed versions, so a later
        # change to a published asset fails the job instead of silently changing
        # what the matrix tests. To be explicit about what that does NOT prove:
        # the upstream project publishes no checksum for these archives, so the
        # values were computed once from the release assets and committed here
        # under review. They detect drift; they do not authenticate the
        # publisher. `latest` moves by design and is recorded, not pinned.
        shell: pwsh
        timeout-minutes: 12
        run: |
          $v = "${{ matrix.ffmpeg }}"
          $pins = @{
            "7.1.1" = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
            "6.1.1" = "742e32fc9f92681f9f254b925e1b613fdd8074ba40749d4879aefdb009b94cc5"
          }
          $url = if ($v -eq "latest") {
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          } else {
            "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip"
          }
          # Inside the job's OWN scratch: a shared RUNNER_TEMP/ffmpeg-$v was
          # swept by name afterwards, which deletes the build a concurrent job
          # on the same self-hosted runner is using. Owned paths mean the
          # cleanup can name exactly what it created (A01/CI).
          $dst = Join-Path $env:FFMWIZ_SCRATCH "ffmpeg-$v"
          $zip = Join-Path $env:FFMWIZ_SCRATCH "ffmpeg-$v.zip"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 900
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($pins.ContainsKey($v)) {
            if ($actual -ne $pins[$v]) {
              throw "ffmpeg $v archive hash $actual does not match the pin $($pins[$v])"
            }
            Write-Host "ffmpeg $v archive matches its pinned SHA256"
          } else {
            Write-Host "ffmpeg $v archive SHA256 (unpinned, recorded): $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in $url" }
          if (-not (Test-Path (Join-Path $exe.Directory.FullName "ffprobe.exe"))) {
            throw "ffprobe.exe is missing from $url"
          }
          $exe.Directory.FullName >> $env:GITHUB_PATH

      - name: Confirm this leg is the ffmpeg it claims to be
        shell: bash --noprofile --norc -eo pipefail "{0}"
        # A silent version drift would turn the two legs into duplicates and the
        # reset_sar branch of the other one would stop being covered. A
        # capability probe alone cannot tell 6.1.1 from 7.1.1 -- neither has
        # reset_sar -- so the VERSION STRING and the resolved PATH are both
        # asserted, for ffmpeg and ffprobe, and the capability check stays on
        # top of that rather than instead of it.
        #
        # No pipes: this shell runs with -o pipefail, and a reader that exits
        # early (head, grep -q) can leave ffmpeg killed by SIGPIPE and fail the
        # step for a reason that has nothing to do with the build.
        run: |
          want="${{ matrix.ffmpeg }}"
          # FFMWIZ_SCRATCH is a WINDOWS path (G:\...) while `command -v` answers
          # in MSYS form (/g/...), so the two never share a prefix. cygpath is
          # what makes the comparison meaningful rather than always false.
          expected_dir="$(cygpath -u "$FFMWIZ_SCRATCH" 2>/dev/null || echo "$FFMWIZ_SCRATCH")/ffmpeg-$want"
          echo "expecting $expected_dir"
          for tool in ffmpeg ffprobe; do
            resolved="$(command -v $tool)"
            echo "$tool -> $resolved"
            case "$resolved" in
              "$expected_dir"*) ;;
              *) echo "$tool resolves outside this job's extraction directory"; exit 1 ;;
            esac
            banner="$($tool -hide_banner -version)"
            echo "$banner" > "$RUNNER_TEMP/$tool-version.txt"
            first="$(head -n 1 "$RUNNER_TEMP/$tool-version.txt")"
            echo "$first"
            if [ "$want" != latest ]; then
              case "$first" in
                "$tool version $want"*) ;;
                *) echo "expected $tool version $want"; exit 1 ;;
              esac
            fi
          done
          case "$(ffmpeg -hide_banner -h filter=scale)" in
            *reset_sar*) have=yes ;;
            *)           have=no ;;
          esac
          expect=$([ "$want" = latest ] && echo yes || echo no)
          echo "scale reset_sar: have=$have expect=$expect"
          [ "$have" = "$expect" ]

      - name: Run test suite
        shell: bash --noprofile --norc -eo pipefail "{0}"
        timeout-minutes: 20
        # tests/run_suite.py runs one module per worker process (stdlib only -
        # this project keeps zero test dependencies). The suite is dominated by
        # real ffmpeg child processes, so parallelism cut it 48s -> ~16s on a
        # 16-core machine; a 2-core runner still gains. --require names what THIS
        # job installs, so a skip for ffmpeg or numpy fails the job while a real
        # NVENC-hardware skip stays legitimate. --json leaves a readable record
        # of what ran, what skipped and why, uploaded below even on failure.
        run: python tests/run_suite.py --require ffmpeg --require numpy --require wheel --json "$RUNNER_TEMP/results.json"

      - name: Upload results
        id: upload
        if: always()
        # Retention is evidence, not a verdict. The account's artifact storage
        # quota is an external condition -- when it is full the upload errors
        # and a job whose suite passed reports failure, which is exactly the
        # false red this step must never produce.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tests-py${{ matrix.python-version }}-ffmpeg${{ matrix.ffmpeg }}
          path: |
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/ffmpeg-version.txt
            ${{ runner.temp }}/ffprobe-version.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Restate the result where a quota cannot evict it
        if: always()
        # The upload above is allowed to fail, so it cannot be the only copy of
        # the evidence. This writes the same facts to the job log and the run's
        # step summary -- neither of which the artifact quota can take away.
        # It reports and never decides: it exits 0 whatever the suite did.
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: python tools/ci_result_summary.py "$RUNNER_TEMP/results.json" "py${{ matrix.python-version }} / ffmpeg ${{ matrix.ffmpeg }}" "${{ steps.upload.outcome }}"

      - name: Remove this job's scratch files
        if: always()
        # Deletes ONLY what this job owns, and proves that before deleting:
        # the target must resolve INSIDE RUNNER_TEMP and must not be a reparse
        # point, so a junction planted in the scratch path cannot redirect the
        # delete outside the owned area. No prefix sweep of shared %TEMP%: a
        # name match is not ownership (R01).
        shell: pwsh
        run: |
          $root = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([char]92)
          # Component-wise, not a string prefix: "G:\runner temp2" StartsWith
          # "G:\runner temp", so a bare prefix test calls a SIBLING contained.
          # Comparing against the root plus a separator is what makes it mean
          # "inside", and the root itself is never a target.
          $prefix = $root + [char]92
          foreach ($target in @($env:FFMWIZ_SCRATCH, (Join-Path $env:RUNNER_TEMP "venv-tests"))) {
            if ([string]::IsNullOrWhiteSpace($target)) { continue }
            if (-not (Test-Path -LiteralPath $target)) { continue }
            $full = [System.IO.Path]::GetFullPath($target).TrimEnd([char]92)
            if ($full -eq $root) {
              Write-Host "refusing to clean RUNNER_TEMP itself: $full"; continue
            }
            if (-not ($full + [char]92).StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Host "refusing to clean outside RUNNER_TEMP: $full"; continue
            }
            $item = Get-Item -LiteralPath $full -Force
            if ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
              Write-Host "refusing to follow a reparse point: $full"; continue
            }
            Remove-Item -LiteralPath $full -Recurse -Force -ErrorAction SilentlyContinue
            # Verified, not assumed: a locked handle leaves the tree in place,
            # and printing "cleaned" for it hides exactly the leak this step
            # exists to prevent.
            if (Test-Path -LiteralPath $full) {
              Write-Host "NOT cleaned (still present): $full"
            } else {
              Write-Host "cleaned: $full"
            }
          }
          # No `ffmpeg-*` sweep any more: the archives and their extraction live
          # inside FFMWIZ_SCRATCH above, so they are already gone, and sweeping
          # RUNNER_TEMP by name deleted whatever a concurrent job was using.

  # The only job that installs PySide6 (665 MB), so a broken pin or a broken GUI
  # module still fails CI now that the other jobs install nothing.
  gui-import:
    runs-on: ${{ vars.CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create a job-owned scratch directory
        # EVERY temporary file this job makes must land somewhere this job owns.
        # The previous cleanup swept `$env:TEMP` for `ffmwiz_*` and deleted every
        # match: on a self-hosted runner running as the desktop user that is the
        # SAME %TEMP% the user's own editor sessions and retained manual-command
        # inputs live in, so a prefix match was being treated as proof of
        # ownership. It is not. Pointing TEMP/TMP/TMPDIR at a per-job directory
        # under RUNNER_TEMP makes ownership structural: the sweep can then be a
        # single scoped delete instead of a pattern hunt through shared state.
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "ffmwiz-scratch-$env:GITHUB_RUN_ID-$env:GITHUB_JOB-gui"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          "TEMP=$scratch"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMPDIR=$scratch"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFMWIZ_SCRATCH=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "job scratch: $scratch"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          # See the tests job: on a self-hosted runner the pip cache is already
          # local, and this is the job whose upload blew the time budget.
          cache: ${{ !vars.CI_RUNNER && 'pip' || '' }}

      - name: Create a job-scoped virtual environment
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: |
          python -m venv "$RUNNER_TEMP/venv-gui"
          echo "$RUNNER_TEMP/venv-gui/Scripts" >> "$GITHUB_PATH"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fail early if the Qt modules the QML suites need are missing
        # Without this the suites below self-skip, and a skip is a weaker signal
        # than an import error: it tells you nothing about WHICH module failed.
        run: python -c "import PySide6, PySide6.QtQml, PySide6.QtQuick; print('Qt OK', PySide6.__version__)"

      - name: Import the classic GUI headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import importlib.util, PySide6; spec = importlib.util.spec_from_file_location('ffmwiz_gui', 'ffmwiz/gui/classic/ffmwiz_gui.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('GUI import OK', PySide6.__version__)"

      - name: Install test dependencies
        # numpy backs the waveform maths the QML tests exercise; without it the
        # waveform cases self-skip and --require numpy would fail the job.
        run: python -m pip install --disable-pip-version-check numpy

      - name: Install ffmpeg
        # The GUI/editor suites decode real media for waveforms and previews.
        # Unpacked rather than installed, for the reason the tests job explains:
        # a self-hosted runner's ffmpeg is the developer's own.
        shell: pwsh
        timeout-minutes: 12
        run: |
          # Job-owned, same reason as the tests job (A01/CI).
          $dst = Join-Path $env:FFMWIZ_SCRATCH "ffmpeg-latest"
          $zip = Join-Path $env:FFMWIZ_SCRATCH "ffmpeg-latest.zip"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -TimeoutSec 900
          Write-Host "ffmpeg latest archive SHA256 (unpinned, recorded): $((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())"
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the release archive" }
          if (-not (Test-Path (Join-Path $exe.Directory.FullName "ffprobe.exe"))) {
            throw "ffprobe.exe is missing from the release archive"
          }
          $exe.Directory.FullName >> $env:GITHUB_PATH

      - name: Confirm the GUI job uses its own ffmpeg
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: |
          # cygpath for the same reason the tests job explains: RUNNER_TEMP is a
          # Windows path and `command -v` answers in MSYS form.
          expected_dir="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/ffmpeg-latest"
          echo "expecting $expected_dir"
          for tool in ffmpeg ffprobe; do
            resolved="$(command -v $tool)"
            echo "$tool -> $resolved"
            case "$resolved" in
              "$expected_dir"*) ;;
              *) echo "$tool resolves outside this job's extraction directory"; exit 1 ;;
            esac
            $tool -hide_banner -version > "$RUNNER_TEMP/$tool-version.txt"
            head -n 1 "$RUNNER_TEMP/$tool-version.txt"
          done

      - name: Run the GUI and QML behaviour suites headless
        shell: bash --noprofile --norc -eo pipefail "{0}"
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        # An import check cannot see a broken binding, a missing QML property or
        # a QML-only join-audio path. This is the ONLY job with PySide6, so
        # without this step those suites skip in every job forever and report
        # green (F13).
        #
        # --require names what THIS job installs. The older --strict-skips
        # classified skips with a pattern that never mentioned PySide6/QtQml/
        # QtQuick, so it returned OK with exactly those classes skipped (B17).
        #
        # The -k list is hand-maintained and therefore drifts: a new Qt suite
        # lands, nothing selects it, and it never runs anywhere. The guard in
        # tests/test_ci_coverage_guard.py reads THIS line and fails when a
        # tests/ module that needs PySide6 is missing from it.
        run: python tests/run_suite.py --require pyside6 --require numpy --require ffmpeg -j 2 --json "$RUNNER_TEMP/results.json" -k gui_editors -k qml_waveform -k theme_tokens -k join_audio_availability -k command_generation_2 -k gui_child_ownership

      - name: Upload results
        id: upload
        if: always()
        # Retention is evidence, not a verdict. The account's artifact storage
        # quota is an external condition -- when it is full the upload errors
        # and a job whose suite passed reports failure, which is exactly the
        # false red this step must never produce.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gui-import-results
          path: |
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/ffmpeg-version.txt
            ${{ runner.temp }}/ffprobe-version.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Restate the result where a quota cannot evict it
        if: always()
        # Same reason as the tests job: the artifact is best-effort, the log and
        # the step summary are not.
        shell: bash --noprofile --norc -eo pipefail "{0}"
        run: python tools/ci_result_summary.py "$RUNNER_TEMP/results.json" "gui-import" "${{ steps.upload.outcome }}"

      - name: Remove this job's scratch files
        if: always()
        # Deletes ONLY what this job owns, and proves that before deleting:
        # the target must resolve INSIDE RUNNER_TEMP and must not be a reparse
        # point, so a junction planted in the scratch path cannot redirect the
        # delete outside the owned area. No prefix sweep of shared %TEMP%: a
        # name match is not ownership (R01).
        shell: pwsh
        run: |
          $root = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([char]92)
          # Component-wise, not a string prefix: "G:\runner temp2" StartsWith
          # "G:\runner temp", so a bare prefix test calls a SIBLING contained.
          # Comparing against the root plus a separator is what makes it mean
          # "inside", and the root itself is never a target.
          $prefix = $root + [char]92
          foreach ($target in @($env:FFMWIZ_SCRATCH, (Join-Path $env:RUNNER_TEMP "venv-gui"))) {
            if ([string]::IsNullOrWhiteSpace($target)) { continue }
            if (-not (Test-Path -LiteralPath $target)) { continue }
            $full = [System.IO.Path]::GetFullPath($target).TrimEnd([char]92)
            if ($full -eq $root) {
              Write-Host "refusing to clean RUNNER_TEMP itself: $full"; continue
            }
            if (-not ($full + [char]92).StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Host "refusing to clean outside RUNNER_TEMP: $full"; continue
            }
            $item = Get-Item -LiteralPath $full -Force
            if ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
              Write-Host "refusing to follow a reparse point: $full"; continue
            }
            Remove-Item -LiteralPath $full -Recurse -Force -ErrorAction SilentlyContinue
            # Verified, not assumed: a locked handle leaves the tree in place,
            # and printing "cleaned" for it hides exactly the leak this step
            # exists to prevent.
            if (Test-Path -LiteralPath $full) {
              Write-Host "NOT cleaned (still present): $full"
            } else {
              Write-Host "cleaned: $full"
            }
          }
          # No `ffmpeg-*` sweep any more: the archives and their extraction live
          # inside FFMWIZ_SCRATCH above, so they are already gone, and sweeping
          # RUNNER_TEMP by name deleted whatever a concurrent job was using.
