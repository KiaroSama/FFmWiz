name: Audit integration verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-windows:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'audit/20260919-editor-resource-clock'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact companion PR patches only in the disposable working tree
        shell: python
        run: |
          import os, pathlib, subprocess
          base = '10649901c3a97b98bf0445d560b1510f3e43d5e8'
          heads = ['a5c92f28e779b14f9dd42a86c14a6315dbb2ddad',
                   '5cc24361b2064c76b0fcce5263ad1fc5ee8cbd61']
          initial = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for head in heads:
              subprocess.run(['git', 'fetch', '--no-tags', 'origin', head], check=True)
              patch = subprocess.check_output(['git', 'diff', '--binary', base, head])
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root / 'audit-identities.txt').write_text(
              f'gui_head={initial}\nbase={base}\ncompanions={heads}\ncombined_tree={tree}\n', encoding='utf-8')
          subprocess.run(['git', 'archive', '--format=zip', '-o', str(root / 'audit-source.zip'), tree], check=True)
          print((root / 'audit-identities.txt').read_text())
          # No commit, merge, push, PR state change or branch update is performed.
      - name: Retain exact combined source
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: audit-combined-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/audit-source.zip
            ${{ runner.temp }}/audit-identities.txt
          retention-days: 3
      - name: Create isolated environment and install required capabilities
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/audit-venv"
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          $python = "$env:RUNNER_TEMP/audit-venv/Scripts/python.exe"
          & $python -m pip install --disable-pip-version-check -r requirements.txt numpy setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed" }
          "$env:RUNNER_TEMP/audit-venv/Scripts" >> $env:GITHUB_PATH
      - name: Install the pinned FFmpeg build into job-owned scratch
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/audit-ffmpeg.zip"
          $dst = "$env:RUNNER_TEMP/audit-ffmpeg"
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip' -OutFile $zip -TimeoutSec 300
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne '04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4') { throw 'FFmpeg archive hash mismatch' }
          Expand-Archive $zip $dst
          $exe = Get-ChildItem $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'FFmpeg executable is missing' }
          $exe.Directory.FullName >> $env:GITHUB_PATH
      - name: Run all tests on the combined tree with native Qt and PowerShell
        shell: pwsh
        run: |
          python tests/run_suite.py -j 2 --module-timeout 180 --require ffmpeg --require numpy --require wheel --require pyside6 --require powershell --json "$env:RUNNER_TEMP/audit-results.json"
          if ($LASTEXITCODE -ne 0) { throw "combined suite failed: $LASTEXITCODE" }
      - name: Retain combined results
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: audit-combined-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/audit-results.json
            ${{ runner.temp }}/audit-identities.txt
          retention-days: 7
      - name: Record a quota-independent result summary
        if: always()
        shell: pwsh
        run: python tools/ci_result_summary.py "$env:RUNNER_TEMP/audit-results.json" 'combined audit / Windows / Qt / FFmpeg 7.1.1' '${{ steps.upload.outcome }}'
