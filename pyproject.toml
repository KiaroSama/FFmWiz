[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmwiz"
version = "0.1.0"
description = "Windows-focused interactive FFmpeg wizard with Cut/Crop GUIs, folder encode, track adding, media reports, stream cleanup remux, and hard-sub encode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.1",
]

[tool.setuptools]
py-modules = ["FFmWiz"]

[tool.py_compile_check]
files = ["FFmWiz.py", "assets/runtime/ffmwiz_gui.py", "assets/runtime/MuxCls.py"]
