[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmwiz"
version = "0.1.0"
description = "Windows-focused interactive FFmpeg wizard with Cut/Crop GUIs, folder encode, track adding, media reports, stream cleanup remux, and hard-sub encode."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    # Still not published to PyPI; this is an upload guard, not a licence claim.
    "Private :: Do Not Upload",
]
dependencies = [
    "PySide6==6.11.2",
]

[project.scripts]
ffmwiz = "FFmWiz:main"

[tool.setuptools]
# The top-level launcher is only the thin entry point; without the package and
# its runtime assets an installed wheel cannot even `import FFmWiz`.
py-modules = ["FFmWiz"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ffmwiz*"]
# Keep namespace discovery on: ffmwiz/gui and ffmwiz/gui/qml have no
# __init__.py, so an explicit `packages = [...]` list would silently drop them.
namespaces = true

[tool.setuptools.package-data]
# Icons, cursors and the QML scene are loaded at runtime from inside the
# package, so they have to ship with it.
#
# `gui/**/*.qml`, not `gui/qml/*.qml`: the editor moved to
# `gui/modern/qml/` in the classic/modern split and the old glob matched
# nothing afterwards. It went unnoticed because a stale `build/lib` from
# before the split still held a file at the old path, and setuptools reuses
# that tree -- so the wheel kept shipping the PRE-SPLIT 102 KB scene while
# the live 37 KB one shipped nowhere. Recursive on purpose: the next move
# must not need this line edited again.
"ffmwiz" = ["assets/**/*", "gui/**/*.qml"]
