# setuptools stages the build tree next to the source, and its default name
# is `build/` -- a valid Python identifier. Python puts the cwd first on
# sys.path, so it imports that DIRECTORY as a namespace package and
# `python -m build` reports that build is a package which cannot be
# executed, when the truth is simply that the build package is not
# installed here. A leading dot can never be an identifier.
#
# The bigger reason: a stale staging tree is reused incrementally, and one
# left over from before the GUI split kept a deleted QML path alive inside
# built wheels. A name nobody mistakes for source is easier to distrust.
[build]
build_base = .build
